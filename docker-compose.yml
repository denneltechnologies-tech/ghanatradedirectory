services:
  db:
    image: postgres:16-alpine
    container_name: ghana-trade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghana}
      POSTGRES_DB: ${POSTGRES_DB:-ghanatrade}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghana} -d ${POSTGRES_DB:-ghanatrade}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
